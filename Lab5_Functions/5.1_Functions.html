<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <pre id="outputb">ผลลัพธ์จะแสดงที่นี้</pre>
    <button onclick="runDemo()">Run Code</button>
    <script>
        function runDemo() {
            const output = []

            function sayhi() {
                output.push("hi")
                console.log("hi")
            }
            sayhi()
            //ฟังก์ชั้นแบบ Arrow
            const sayhiArrow = () => {
                output.push("hi form Arrow")
                console.log("hi form Arrow")
            }
            sayhiArrow()
            //ส่งค่าเข้า
            function greet(name) {
                output.push("hello " + name)
                console.log("hello " + name)
            }
            greet("Beem")
            //ส่งค่าออก Return
            function add(a,b) {
                return a + b
            }

            let sum = add(5,7)
            output.push("ผลรวม 5 + 7 = "+ sum)
            console.log("ผลรวม: "+sum)

            document.getElementById("outputb").textContent = output.join("\n")
        }
    </script>
</body>
</html>
