<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="runDemo()">Run Code</button>
    <pre id="output">ผลลัพธ์จะแสดงที่นี้</pre>
    <script>
        function runDemo() {
            let maxNumber = 15
            const output = []
            for (let i = 0; i <= maxNumber; i++) {
                if (i % 2 == 0) {
                    output.push(i+" (คู่)")
                    console.log(i," (คู่)")
                } else {
                    output.push(i+" (คี่)")
                    console.log(i," (คี่)")
                }
                
            }
            for (let i = 0; i <= maxNumber; i+=2) {
                output.push("นับทีละ 2 : "+i)
                console.log("นับทีละ 2 : ",i)
                
            }
            for (let i = maxNumber; i >= 0 ; i--) {
                output.push("ถอยหลัง: "+i)
                console.log("ถอยหลัง: ",i)
            }
            document.getElementById("output").textContent = output.join("\n");
        }
        

    </script>
</body>
</html>
